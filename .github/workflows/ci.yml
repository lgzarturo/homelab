name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        # macOS y Windows gastan muchos más minutos de Actions: solo corren al lanzar
        # el workflow a mano (Actions → CI → Run workflow). En automático, solo Linux.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formato
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yml válido con .env.example
        run: docker compose --env-file .env.example config --quiet

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pruebas, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compilar para Linux, macOS y Windows
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build.sh
      - name: Publicar los binarios
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
